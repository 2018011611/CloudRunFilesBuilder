# 轻量好用的文件管理器(luci-app-quickfile by sbwml)
name: Make 25.12 quickfile run files

on:
#  schedule:
#    - cron: "4 22 * * *"  # 北京时间早上 6 点 04
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest prerelease info
        id: fetch_release
        run: |
          curl -s https://api.github.com/repos/2018011611/quickfile/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json
       
      - name: Parse asset download URLs
        id: parse_assets
        shell: bash
        run: |
          set -e

          echo "开始精准解析 Release 资产文件..."

          # 精准匹配当前的 3 个文件
          CORE_URL=$(jq -r '[.assets[] | select(.name | test("^quickfile-[0-9].*\\.apk$")) | .browser_download_url][0] | select(. != null)' release.json)
          LUCI_URL=$(jq -r '[.assets[] | select(.name | test("^luci-app-quickfile-.*\\.apk$")) | .browser_download_url][0] | select(. != null)' release.json)
          I18N_URL=$(jq -r '[.assets[] | select(.name | test("^luci-i18n-quickfile-zh-cn-.*\\.apk$")) | .browser_download_url][0] | select(. != null)' release.json)

          echo "DEBUG CORE_URL=$CORE_URL"
          echo "DEBUG LUCI_URL=$LUCI_URL"
          echo "DEBUG I18N_URL=$I18N_URL"

          # 断言守卫：确保三个文件全部找齐
          if [ -z "$CORE_URL" ] || [ -z "$LUCI_URL" ] || [ -z "$I18N_URL" ]; then
            echo "======================================================================="
            echo "❌ 错误：未能完整匹配到最新的 3 个 APK 文件，请检查 Release 资产名称！"
            echo "======================================================================="
            exit 1
          fi

          # 写入环境变量
          echo "CORE_URL=$CORE_URL" >> $GITHUB_ENV
          echo "LUCI_URL=$LUCI_URL" >> $GITHUB_ENV
          echo "I18N_URL=$I18N_URL" >> $GITHUB_ENV
       
      - name: Download apk files
        run: |
          mkdir -p quickfile_dist
          wget "$CORE_URL" -P quickfile_dist/
          wget "$LUCI_URL" -P quickfile_dist/
          wget "$I18N_URL" -P quickfile_dist/

          # 从 quickfile-1.0.24-r1.apk 中提取版本号 1.0.24-r1
          file=$(basename "$CORE_URL")
          version="${file#quickfile-}"
          version="${version%.apk}"

          echo "VERSION=$version" >> $GITHUB_ENV
          echo "成功提取到版本号: $version"

      - name: Create install.sh script
        run: |
          cat <<EOF > quickfile_dist/install.sh
          #!/bin/sh
          apk update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          apk add bash
          apk add --allow-untrusted *.apk
          # fix nginx
          uci set nginx.global.uci_enable='true'
          uci del nginx._lan
          uci del nginx._redirect2ssl
          uci add nginx server
          uci rename nginx.@server[0]='_lan'
          uci set nginx._lan.server_name='_lan'
          uci add_list nginx._lan.listen='80 default_server'
          uci add_list nginx._lan.listen='[::]:80 default_server'
          uci add_list nginx._lan.include='conf.d/*.locations'
          uci set nginx._lan.access_log='off; # logd openwrt'
          uci commit nginx
          service nginx restart
          EOF
          chmod +x quickfile_dist/install.sh

      - name: Move directory to makeself
        run: |
          mv quickfile_dist makeself/

      - name: Create self-extracting package
        run: |
          cd makeself
          ./makeself.sh quickfile_dist/ 25_quickfile_${VERSION}.run "by github action" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh makeself/*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
           
      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/2018011611/quickfile/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
              <a href="https://wkdaily.cpolar.cn/archives/1">
                <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
              </a>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
